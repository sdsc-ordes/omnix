<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}omnix{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="{{ url_for('dashboard') }}" class="brand">omnix</a>
      {% for k in kinds %}
        <a href="{{ url_for('entity_list', slug=k.slug) }}">{{ k.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
