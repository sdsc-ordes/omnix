{% extends "base.html" %} {% block title %}omnix — {{ kind.title }}{% endblock
%} {% block content %}
<h1>{{ kind.title }}</h1>

<form
  class="filters"
  hx-get="{{ url_for('entity_rows', slug=kind.slug) }}"
  hx-target="#rows"
  hx-trigger="change, keyup delay:350ms"
  hx-push-url="true"
>
  {% for w in widgets %}
  <label class="filter">
    <span>{{ w.col }}</span>
    {% if w.options %}
    <select name="{{ w.col }}">
      <option value="">any</option>
      {% for opt in w.options %} {% if opt == w.value %}
      <option value="{{ opt }}" selected>{{ opt }}</option>
      {% else %}
      <option value="{{ opt }}">{{ opt }}</option>
      {% endif %} {% endfor %}
    </select>
    {% else %}
    <input
      type="text"
      name="{{ w.col }}"
      value="{{ w.value }}"
      placeholder="contains…"
    />
    {% endif %}
  </label>
  {% endfor %}
  <a class="clear" href="{{ url_for('entity_list', slug=kind.slug) }}">clear</a>
</form>

{% include "_rows.html" %} {% endblock %}
